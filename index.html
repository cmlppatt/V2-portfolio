<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cath's Portfolio</title>
    <link rel="stylesheet" href="https://use.typekit.net/wrj3gbg.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <style>
      .main-page-container{
        display: flex;
      }
      
      .side-menu-main{
        background-color: #FCF4ED;
        width: 25%;
        height: 100vh;
      }
      
      .name-space-main{
        background-color: #0D2BCD;
        color: #FCF4ED;
        width: 75%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
      }
      
      .name-big{
        margin-bottom: -5vh;
        font-size: 29vw;
        font-family: inter, roboto, sans-serif;
        font-weight: 700;
        letter-spacing: -0.09em;
        transform: translateX(-0.03em)
      }
      
      .loosen{ /*for the space between C & A in CATH*/
        margin-left: 0.05em;
      }
      
      .scroll-to-explore{
        font-family: "IBM Plex Sans", roboto, sans-serif;
        font-weight: 300;
        margin-top: 8vh;
        font-size: clamp(0px, 1.5vw, 16px);
      }
      .menu-text-box{
        font-family: "IBM Plex Sans", roboto, sans-serif;
        height: 100vh;
        font-weight: 600;
        display: flex;
        flex-direction: column;
        color: #272932;
      }
      
      .menu-header{
        margin-right: 2vw;
        margin-left: 1vw;
        font-size: clamp(0px, 1.5vw, 24px);
      }
      
      .logo-menu-img{
        width: 3vw;
        height: 3vw;
      }
      
      .top-row{
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      
      .bottom-row{
        text-align: right;
        margin-top: 2.5vh;
        font-weight: 300;
      }
      
      .menu-directory{
        margin-top: auto;
        padding-bottom: 1vh;
        font-size: clamp(0px, 3vw, 48px);
      }
      
      .menu-item{
        border-bottom: 0.3vh solid #0D2BCD;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        width: 100%;
        margin-bottom: 4vh;
      }
      
      .menu-item-title
      {
        padding-bottom: 0;
        margin-left: 1vw;
        margin-bottom: 1vh;
      }
      
      .menu-item-description{
        font-size: clamp(0px, 1.5vw, 24px);
        font-weight: 300;
        text-align: right;
        margin-right: 2vw;
        line-height: 1;
        padding-bottom: 0;
        margin-bottom: 1.5vh;
      }

    </style>
  </head>
  <body>
    <div class="main-page-container">
      <div class="side-menu-main">
        <div class="menu-text-box">
          <div class="menu-header">
            <div class="top-row">
              <img class="logo-menu-img" src="racket.png" alt="CP turnkey logo">
              <p>Catherine Patterson</p>
            </div>
            <div class="bottom-row">
              <p>
                Front-End Web Developer<br>& Graphic Desginer
              </p>
            </div>
          </div>
          <div class="menu-directory">
            <div class="menu-item"> 
              <p class="menu-item-title">WORK</p>
              <p class="menu-item-description">
                Projects<br>Process
              </p>
            </div>
            <div class="menu-item">
              <p class="menu-item-title">PROFILE</p>
              <p class="menu-item-description">
                About<br>Education<br>Skills
              </p>
            </div>
            <div class="menu-item">
              <p class="menu-item-title">CONTACT</p>
              <p class="menu-item-description">
                Email<br>Phone #
              </p>
            </div>
          </div>
        </div>
      </div>
      <div class="name-space-main">
        <div class="scroll-to-explore">
           &darr; scroll to explore &darr;
        </div>
        <div class="name-big">
          C<span class="loosen">A</span>TH
        </div>
      </div>
    </div>


  </body>
</html>
