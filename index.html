      </div>
      <div class="display-space-work">
        <div class="carousel">
          <div class="carousel-track">
            <!-- clone last slide first for infinite illusion -->
            <div class="slide"><img src="photoshop.png" alt=""></div>
            <!-- real slides -->
            <div class="slide"><img src="premiere.png" alt=""></div>
            <div class="slide"><img src="indesign.png" alt=""></div>
            <div class="slide"><img src="photoshop.png" alt=""></div>
            <!-- clone first slide last for infinite illusion -->
            <div class="slide"><img src="premiere.png" alt=""></div>
          </div>
        </div>

        <script>
         const track = document.querySelector('.carousel-track');
const slides = document.querySelectorAll('.slide');
const slideCount = slides.length;
let currentIndex = 1; // start at first real slide
let isDragging = false;
let startX = 0;
let currentTranslate = 0;
let prevTranslate = 0;

// Set initial position
function setPosition() {
  const width = track.parentElement.clientWidth;
  track.style.transform = `translateX(${-currentIndex * width}px)`;
}
setPosition();

// Adjust on window resize
window.addEventListener('resize', setPosition);

// Drag events
track.addEventListener('mousedown', startDrag);
track.addEventListener('touchstart', startDrag);
track.addEventListener('mousemove', drag);
track.addEventListener('touchmove', drag);
track.addEventListener('mouseup', endDrag);
track.addEventListener('touchend', endDrag);
track.addEventListener('mouseleave', endDrag);

function getX(e){
  return e.type.includes('mouse') ? e.pageX : e.touches[0].clientX;
}

function startDrag(e){
  isDragging = true;
  startX = getX(e);
  track.style.transition = 'none';
}

function drag(e){
  if(!isDragging) return;
  const x = getX(e);
  const diff = x - startX;
  const width = track.parentElement.clientWidth;
  track.style.transform = `translateX(${ -currentIndex * width + diff }px)`;
}

function endDrag(e){
  if(!isDragging) return;
  isDragging = false;
  const x = getX(e);
  const diff = x - startX;
  const width = track.parentElement.clientWidth;

  // Move to next/prev slide if drag is > threshold
  if(diff < -50) currentIndex += 1;
  else if(diff > 50) currentIndex -= 1;

  track.style.transition = 'transform 0.3s ease';
  track.style.transform = `translateX(${-currentIndex * width}px)`;

  // Infinite loop adjustment
  setTimeout(() => {
    if(currentIndex === 0) currentIndex = slideCount - 2;
    if(currentIndex === slideCount - 1) currentIndex = 1;
    track.style.transition = 'none';
    track.style.transform = `translateX(${-currentIndex * width}px)`;
  }, 310);
}
          </script>
